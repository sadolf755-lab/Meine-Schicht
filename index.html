<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f4e78"><link rel="manifest" href="./manifest.webmanifest"><title>Meine Schicht</title><style>
body{margin:0;background:#f2f4f7;color:#17202a;font-family:Arial,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}h1{margin:4px 0}.sub{color:#667085;margin-bottom:14px}.card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 2px 10px #0001}button,input,select,textarea{font:inherit}button{border:0;border-radius:13px;padding:14px 10px;font-weight:700}.wide{width:100%;background:#dceeff;text-align:left;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.role{min-height:82px}.az{background:#e7eef5}.sak{background:#fff0b8}.buep{background:#e3f0e8}.sipo{background:#e7e7e7}.green{background:#d9f7df}.blue{background:#dceeff}.yellow{background:#fff0c9}.red{background:#ffdcdc}.small{padding:10px;background:#e9ecef}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d9dee5;border-radius:10px;background:#fff;margin-bottom:7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none}.muted{color:#667085;font-size:14px}.item{border:1px solid #d9dee5;border-radius:12px;padding:11px;margin:8px 0}.event{border-left:4px solid #1f4e78;background:#f8fafc;padding:8px;margin:6px 0;border-radius:7px}.danger{background:#ffdcdc}
</style></head><body><div class="wrap"><h1>Meine Schicht</h1><div class="sub">Wenig Eingaben – möglichst vollständige Dokumentation.</div>
<section id="home"><button class="wide" onclick="show('plan')">📅 Einsätze KW <span id="kw"></span></button><div class="card"><div class="grid"><button class="role az" onclick="openRole('AZF./RbBau')">🚂<br>AZF. / RbBau</button><button class="role sak" onclick="openRole('SAKRA')">🦺<br>SAKRA</button><button class="role buep" onclick="openRole('BüP')">🚧<br>BüP</button><button class="role sipo" onclick="openRole('Sipo')">🦺<br>Sipo</button></div></div>
<div class="card"><h2>Fahrt & Schicht</h2><div class="grid"><button class="green" onclick="departure()">🚗<br>ABFAHRT</button><button class="blue" onclick="arrive()">📍<br>ANGEKOMMEN</button><button class="yellow" onclick="beginShift()">▶️<br>SCHICHT BEGINNEN</button><button class="red" onclick="simpleEvent('Schichtende')">🛑<br>SCHICHT ENDE</button></div><hr><label>Startort</label><select id="start"><option>Hauptwohnung</option><option>Zweitwohnung Arbeit</option><option>Sonstiger Startort</option></select><input id="startOther" placeholder="Sonstiger Startort"><label>KM bei Abfahrt</label><input id="kmStart" type="number"><label>Einsatzort</label><input id="ort" placeholder="wird bei ANGEKOMMEN abgefragt"><label>KM bei Zuhause</label><input id="kmEnd" type="number"><button class="small" onclick="homeArrival()">🏠 ZUHAUSE</button></div>
<div class="card"><h2>Heute</h2><div id="today" class="muted">Noch keine Erfassung.</div></div><div class="card"><button class="small" onclick="exportPDF()">📄 PDF-Bericht</button><button class="small danger" onclick="clearData()">🗑️ Daten löschen</button></div></section>
<section id="plan" class="hidden"><button class="small" onclick="show('home')">← Zurück</button><div class="card"><h2>📅 Einsätze KW <span id="kw2"></span></h2><div id="week"></div><button class="small" onclick="addPlan()">＋ Einsatz hinzufügen</button></div></section>
<section id="role" class="hidden"><button class="small" onclick="show('home')">← Zurück</button><div class="card"><h2 id="roleTitle"></h2><div id="setup"></div></div><div class="card"><div id="buttons"></div></div><div class="card"><h2>Dokumentation</h2><div id="events" class="muted"></div></div></section>
</div><script>
const KEY='meine_schicht_v3';let role='';
const get=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}};const save=d=>localStorage.setItem(KEY,JSON.stringify(d));const pad=n=>String(n).padStart(2,'0');
function now(){let d=new Date();return{date:`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`,time:`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function kw(){let d=new Date(Date.UTC(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()));let day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);let y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-y)/86400000)+1)/7)}
function show(id){['home','plan','role'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='plan')renderPlans();render()}
function add(type,extra={}){let n=now(),d=get();d.push({kind:'event',date:n.date,time:n.time,type,role,...extra});save(d);render();renderRole()}
function simpleEvent(type){add(type)}
function departure(){let km=document.getElementById('kmStart').value;if(!km)return alert('Bitte KM-Stand bei Abfahrt eingeben.');add('Abfahrt',{start:document.getElementById('start').value,startOther:document.getElementById('startOther').value,kmStart:km})}
function arrive(){let o=prompt('Einsatzort:',document.getElementById('ort').value||'');if(!o)return;document.getElementById('ort').value=o;add('Angekommen',{ort:o})}
function beginShift(){let r=prompt('Funktion:\n1 AZF./RbBau\n2 SAKRA\n3 BüP\n4 Sipo','');let m={'1':'AZF./RbBau','2':'SAKRA','3':'BüP','4':'Sipo'};if(!m[r])return;openRole(m[r]);add('Schichtbeginn',{role:m[r]})}
function openRole(r){role=r;document.getElementById('roleTitle').textContent=r==='AZF./RbBau'?'🚂 AZF. / RbBau':r==='SAKRA'?'🦺 SAKRA':r==='BüP'?'🚧 BüP':'🦺 Sipo';setupRole();renderRole();show('role')}
function setupRole(){let e=document.getElementById('setup');if(role==='Sipo')e.innerHTML='<label>Zugeordnete SAKRA (optional)</label><input id="sS" placeholder="Name"><button class="small" onclick="saveSetup()">Speichern</button>';else if(role==='SAKRA')e.innerHTML='<label>Sipo dabei (optional)</label><input id="sS"><label>Einsatzbereich</label><select id="sA" onchange="sakFields()"><option value="">Bitte wählen</option><option>Bahnhof</option><option>Strecke</option><option>Bahnübergang</option></select><div id="sF"></div><button class="small" onclick="saveSetup()">Grunddaten speichern</button>';else if(role==='BüP')e.innerHTML='<label>BÜ / Bezeichnung</label><input id="bN"><label>Strecke</label><input id="bS"><label>km</label><input id="bK"><div class="row"><div><label>Fahrdienst 1</label><input id="f1"></div><div><label>Fahrdienst 2 optional</label><input id="f2"></div></div><button class="small" onclick="saveSetup()">Grunddaten speichern</button>';else e.innerHTML='<div class="muted">Rangier- und Baustellendokumentation.</div>'}
function sakFields(){let v=document.getElementById('sA').value,e=document.getElementById('sF');e.innerHTML=v==='Bahnhof'?'<label>Bahnhof</label><input id="sP">':v==='Strecke'?'<label>Strecke</label><input id="sP"><label>km</label><input id="sK">':v==='Bahnübergang'?'<label>BÜ</label><input id="sP"><label>Strecke</label><input id="sT"><label>km</label><input id="sK">':''}
function saveSetup(){let n=now(),d=get(),x={kind:'setup',date:n.date,time:n.time,role};if(role==='Sipo')x.sakra=document.getElementById('sS').value;if(role==='SAKRA'){x.sipo=document.getElementById('sS').value;x.area=document.getElementById('sA').value;x.place=document.getElementById('sP')?.value||'';x.km=document.getElementById('sK')?.value||'';x.strecke=document.getElementById('sT')?.value||''}if(role==='BüP'){x.bue=document.getElementById('bN').value;x.strecke=document.getElementById('bS').value;x.km=document.getElementById('bK').value;x.fd1=document.getElementById('f1').value;x.fd2=document.getElementById('f2').value}d.push(x);save(d);renderRole()}
function renderRole(){let e=document.getElementById('buttons');if(!e)return;if(role==='Sipo')e.innerHTML='<div class="grid"><button class="green" onclick="add(\'Sipo Schichtbeginn\')">▶️ Beginn</button><button class="red" onclick="add(\'Sipo Schichtende\')">🛑 Ende</button></div>';else if(role==='SAKRA')e.innerHTML='<div class="grid"><button class="small" onclick="add(\'Sperrgespräch geführt\')">🗣️ Sperrgespräch</button><button class="small" onclick="detail(\'Sperrung erhalten\',\'Gleis / Streckenabschnitt\')">🔒 Sperrung erhalten</button><button class="small" onclick="add(\'Sperrung aufgehoben\')">🔓 Sperrung aufgehoben</button><button class="small" onclick="detail(\'Sperrung nicht erhalten\',\'Grund\')">❌ Nicht erhalten</button></div>';else if(role==='BüP')e.innerHTML='<div class="grid"><button class="small" onclick="add(\'Zugmeldung erhalten\')">📞 Zugmeldung</button><button class="small" onclick="add(\'Sicherungsmaßnahme durchgeführt\')">🛑 Sicherung</button><button class="small" onclick="add(\'Zug vorbeigefahren\')">🚆 Zug vorbei</button><button class="small" onclick="add(\'Sicherungsmaßnahme aufgehoben\')">✅ Aufgehoben</button></div>';else e.innerHTML='<div class="grid"><button class="small" onclick="move()">🚂 Rangieren</button><button class="small" onclick="add(\'Ankuppeln\')">🔗 Ankuppeln</button><button class="small" onclick="add(\'Abkuppeln\')">🔓 Abkuppeln</button><button class="small" onclick="add(\'Zug neu zusammengestellt\')">🔄 Neu zusammengestellt</button><button class="small" onclick="add(\'Bremsprobe durchgeführt\')">🛑 Bremsprobe</button><button class="small" onclick="add(\'Wagenliste erstellt\')">📋 Wagenliste</button><button class="small" onclick="loadUnload()">📦 Laden / Entladen</button><button class="small" onclick="detail(\'Warten\',\'Grund\')">⏳ Warten</button><button class="small" onclick="detail(\'Störung\',\'Beschreibung\')">⚠️ Störung</button><button class="small" onclick="add(\'Zug fertig\')">✅ Zug fertig</button></div>';renderEvents()}
function detail(t,p){let v=prompt(p+':','');if(v!==null)add(t,{detail:v})}function move(){let v=prompt('Von:','');if(v===null)return;let n=prompt('Nach:','');if(n===null)return;add('Rangieren',{von:v,nach:n,fahrart:confirm('Geschoben? OK = geschoben, Abbrechen = gezogen')?'geschoben':'gezogen'})}function loadUnload(){add(confirm('OK = Beladen, Abbrechen = Entladen')?'Beladen':'Entladen')}
function renderEvents(){let e=document.getElementById('events');if(!e)return;let a=get().filter(x=>x.kind==='event'&&x.role===role);e.innerHTML=a.length?a.slice().reverse().map(x=>`<div class="event"><b>${x.time}</b> – ${esc(x.type)}${x.detail?' – '+esc(x.detail):''}${x.von?' – '+esc(x.von)+' → '+esc(x.nach):''}</div>`).join(''):'Noch keine Ereignisse.'}
function render(){document.getElementById('kw').textContent=kw();document.getElementById('kw2').textContent=kw();let a=get().filter(x=>x.kind==='event'&&x.date===now().date);document.getElementById('today').innerHTML=a.length?a.map(x=>`${x.time} – ${esc(x.type)}${x.role?' – '+esc(x.role):''}`).join('<br>'):'Noch keine Erfassung.';renderEvents()}
function addPlan(){let date=prompt('Datum TT.MM.JJJJ:','');if(!date)return;let time=prompt('Geplante Zeit:','');if(!time)return;let r=prompt('Tätigkeit (AZF./RbBau, SAKRA, BüP, Sipo):','AZF./RbBau');let o=prompt('Einsatzort:','')||'';let d=get();d.push({kind:'plan',id:Date.now(),date,time,role:r,ort:o});save(d);renderPlans()}
function renderPlans(){let a=get().filter(x=>x.kind==='plan'),e=document.getElementById('week');e.innerHTML=a.length?a.map(p=>`<div class="item"><b>${esc(p.date)}</b> · ${esc(p.time)}<br>${esc(p.role)}${p.ort?' · '+esc(p.ort):''}<br><button class="small" onclick="editPlan(${p.id})">✏️ Ändern</button> <button class="small danger" onclick="delPlan(${p.id})">🗑️ Löschen</button></div>`).join(''):'Noch keine Einsätze geplant.'}
function editPlan(id){let d=get(),p=d.find(x=>x.id===id);if(!p)return;p.date=prompt('Datum:',p.date)||p.date;p.time=prompt('Zeit:',p.time)||p.time;p.role=prompt('Tätigkeit:',p.role)||p.role;p.ort=prompt('Einsatzort:',p.ort)||'';save(d);renderPlans()}function delPlan(id){if(confirm('Einsatz löschen?')){save(get().filter(x=>x.id!==id));renderPlans()}}
function homeArrival(){let km=document.getElementById('kmEnd').value;if(!km)return alert('Bitte KM-Stand bei Zuhause eingeben.');add('Zuhause',{kmEnd:km})}
function exportPDF(){let a=get().filter(x=>x.kind==='event');if(!a.length)return alert('Noch keine Daten.');let w=window.open('','_blank');if(!w)return alert('Pop-up blockiert.');let rows=a.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.time)}</td><td>${esc(x.role)}</td><td>${esc(x.type)}</td><td>${esc(x.detail||'')}</td><td>${esc(x.von||'')}</td><td>${esc(x.nach||'')}</td></tr>`).join('');w.document.write(`<html><head><meta charset="utf-8"><title>Meine Schicht</title><style>body{font-family:Arial;margin:20px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #aaa;padding:5px;text-align:left}@media print{@page{size:A4 landscape;margin:12mm}button{display:none}}</style></head><body><h1>Meine Schicht – Tagesbericht</h1><table><tr><th>Datum</th><th>Zeit</th><th>Tätigkeit</th><th>Ereignis</th><th>Detail</th><th>Von</th><th>Nach</th></tr>${rows}</table><br><button onclick="print()">📄 Als PDF speichern</button></body></html>`);w.document.close()}
function clearData(){if(confirm('Daten löschen?\n\nAlle gespeicherten Einsätze und Erfassungsdaten werden gelöscht.')){localStorage.removeItem(KEY);role='';render();renderPlans();alert('Daten wurden gelöscht.')}}render();
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});</script></body></html>
