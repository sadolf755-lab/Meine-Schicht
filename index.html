<div class="wrap"><div class="app-header"><img src="meine-schicht-icon-192.png" alt="Meine Schicht" class="app-logo"><div class="app-title"><h1>Meine Schicht</h1><div class="sub">Wenig Eingaben – möglichst vollständige Dokumentation.</div></div></div>
<section id="home"><button class="wide" onclick="show('plan')">📅 Einsätze KW <span id="kw"></span></button><div class="card"><div class="grid"><button class="role az" onclick="openRole('AZF./RbBau')">🚂<br>AZF. / RbBau</button><button class="role sak" onclick="openRole('SAKRA')">🦺<br>SAKRA</button><button class="role buep" onclick="openRole('BüP')">🚧<br>BüP</button><button class="role sipo" onclick="openRole('Sipo')">🦺<br>Sipo</button></div></div>

</div><script>
const KEY='meine_schicht_v3';const RANGIER_KEY='meine_schicht_aktiver_rangier_v1';let role='';let planWeekOffset=0;
function getActiveRangier(){try{return JSON.parse(localStorage.getItem(RANGIER_KEY)||'null')}catch(e){return null}}
function setActiveRangier(x){if(x)localStorage.setItem(RANGIER_KEY,JSON.stringify(x));else localStorage.removeItem(RANGIER_KEY)}
const get=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}};const save=d=>localStorage.setItem(KEY,JSON.stringify(d));const pad=n=>String(n).padStart(2,'0');
function now(){let d=new Date();return{date:`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`,time:`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function kw(){let d=new Date(Date.UTC(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()));let day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);let y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-y)/86400000)+1)/7)}
function show(id){['home','plan','role','settings'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='plan')renderPlans();if(id==='settings')loadSettings();render()}
const SETTINGS_KEY='meine_schicht_stammdaten';
function getSettings(){try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}catch(e){return{}}}
function openSettings(){loadSettings();show('settings')}
function loadSettings(){let s=getSettings();document.getElementById('setEmployer').value=s.employer||'';document.getElementById('setName').value=s.name||'';document.getElementById('setPersonal').value=s.personal||''}
function saveSettings(){localStorage.setItem(SETTINGS_KEY,JSON.stringify({employer:document.getElementById('setEmployer').value.trim(),name:document.getElementById('setName').value.trim(),personal:document.getElementById('setPersonal').value.trim()}));alert('Persönliche Daten gespeichert.')}
function add(type,extra={}){let n=now(),d=get();d.push({kind:'event',date:n.date,time:n.time,type,role,...extra});save(d);render();renderRole()}
function simpleEvent(type){add(type)}
function departure(){
  let km=prompt('KM-Stand bei Abfahrt:','');
  if(km===null||!km.trim())return;
  if(!/^\d+(?:[.,]\d+)?$/.test(km.trim()))return alert('Bitte einen gültigen KM-Stand eingeben.');
  add('Abfahrt',{start:document.getElementById('start').value,startOther:document.getElementById('startOther').value,kmStart:km.trim().replace(',','.')});
}
function arrivalFields(){
 let t=document.getElementById('arrivalType')?.value;
 let e=document.getElementById('arrivalExtra');
 if(!e)return;
 e.innerHTML=t==='Einsatzort'?'<input id="arrivalOrt" placeholder="Einsatzort">':'';
}
function arrive(){
 let t=document.getElementById('arrivalType')?.value||'Einsatzort';
 let ort=t==='Einsatzort'?(document.getElementById('arrivalOrt')?.value||prompt('Einsatzort:','')):t;
 if(!ort)return;
 add('Angekommen',{zielart:t,ort});
}
function beginShift(){let r=prompt('Funktion:\n1 AZF./RbBau\n2 SAKRA\n3 BüP\n4 Sipo','');let m={'1':'AZF./RbBau','2':'SAKRA','3':'BüP','4':'Sipo'};if(!m[r])return;openRole(m[r]);add('Schichtbeginn',{role:m[r]})}
function openRole(r){role=r;document.getElementById('roleTitle').textContent=r==='AZF./RbBau'?'🚂 AZF. / RbBau':r==='SAKRA'?'🦺 SAKRA':r==='BüP'?'🚧 BüP':'🦺 Sipo';setupRole();renderRole();show('role')}
function setupRole(){let e=document.getElementById('setup');if(role==='Sipo')e.innerHTML='<label>Zugeordnete SAKRA (optional)</label><input id="sS" placeholder="Name"><button class="small" onclick="saveSetup()">Speichern</button>';else if(role==='SAKRA')e.innerHTML='<label>Sipo dabei (optional)</label><input id="sS"><label>Einsatzbereich</label><select id="sA" onchange="sakFields()"><option value="">Bitte wählen</option><option>Bahnhof</option><option>Strecke</option><option>Bahnübergang</option></select><div id="sF"></div><button class="small" onclick="saveSetup()">Grunddaten speichern</button>';else if(role==='BüP')e.innerHTML='<label>BÜ / Bezeichnung</label><input id="bN"><label>Strecke</label><input id="bS"><label>km</label><input id="bK"><div class="row"><div><label>Fahrdienst 1</label><input id="f1"></div><div><label>Fahrdienst 2 optional</label><input id="f2"></div></div><button class="small" onclick="saveSetup()">Grunddaten speichern</button>';else e.innerHTML='<div class="muted">Rangier- und Baustellendokumentation.</div>'}
function sakFields(){let v=document.getElementById('sA').value,e=document.getElementById('sF');e.innerHTML=v==='Bahnhof'?'<label>Bahnhof</label><input id="sP">':v==='Strecke'?'<label>Strecke</label><input id="sP"><label>km</label><input id="sK">':v==='Bahnübergang'?'<label>BÜ</label><input id="sP"><label>Strecke</label><input id="sT"><label>km</label><input id="sK">':''}
function saveSetup(){let n=now(),d=get(),x={kind:'setup',date:n.date,time:n.time,role};if(role==='Sipo')x.sakra=document.getElementById('sS').value;if(role==='SAKRA'){x.sipo=document.getElementById('sS').value;x.area=document.getElementById('sA').value;x.place=document.getElementById('sP')?.value||'';x.km=document.getElementById('sK')?.value||'';x.strecke=document.getElementById('sT')?.value||''}if(role==='BüP'){x.bue=document.getElementById('bN').value;x.strecke=document.getElementById('bS').value;x.km=document.getElementById('bK').value;x.fd1=document.getElementById('f1').value;x.fd2=document.getElementById('f2').value}d.push(x);save(d);renderRole()}
function renderRole(){let e=document.getElementById('buttons');if(!e)return;if(role==='Sipo')e.innerHTML='<div class="grid"><button class="green" onclick="add(\'Sipo Schichtbeginn\')">▶️ Beginn</button><button class="red" onclick="add(\'Sipo Schichtende\')">🛑 Ende</button></div>';else if(role==='SAKRA')e.innerHTML='<div class="grid"><button class="small" onclick="add(\'Sperrgespräch geführt\')">🗣️ Sperrgespräch</button><button class="small" onclick="detail(\'Sperrung erhalten\',\'Gleis / Streckenabschnitt\')">🔒 Sperrung erhalten</button><button class="small" onclick="add(\'Sperrung aufgehoben\')">🔓 Sperrung aufgehoben</button><button class="small" onclick="detail(\'Sperrung nicht erhalten\',\'Grund\')">❌ Nicht erhalten</button></div>';else if(role==='BüP')e.innerHTML='<div class="grid"><button class="small" onclick="add(\'Zugmeldung erhalten\')">📞 Zugmeldung</button><button class="small" onclick="add(\'Sicherungsmaßnahme durchgeführt\')">🛑 Sicherung</button><button class="small" onclick="add(\'Zug vorbeigefahren\')">🚆 Zug vorbei</button><button class="small" onclick="add(\'Sicherungsmaßnahme aufgehoben\')">✅ Aufgehoben</button></div>';else {
 let active=getActiveRangier();
 let r=active
 ? '<button class="small" onclick="continueMove()">▶️ Weiter</button><button class="small" onclick="holdMove()">⏸ Halten / Warten</button><button class="small danger" onclick="endMove()">⏹ Rangiervorgang beenden</button>'
 : '<button class="small" onclick="move()">🚂 Rangieren</button>';
 e.innerHTML='<div class="grid">'+r+
 '<button class="small" onclick="add(\'Ankuppeln\')">🔗 Ankuppeln</button>'+
 '<button class="small" onclick="add(\'Abkuppeln\')">🔓 Abkuppeln</button>'+
 '<button class="small" onclick="add(\'Zug neu zusammengestellt\')">🔄 Neu zusammengestellt</button>'+
 '<button class="small" onclick="add(\'Bremsprobe durchgeführt\')">🛑 Bremsprobe</button>'+
 '<button class="small" onclick="add(\'Wagenliste erstellt\')">📋 Wagenliste</button>'+
 '<button class="small" onclick="secureWagons()">🚂 Wagen gesichert</button>'+
 '<button class="small" onclick="parkVehicle()">🅿️ Wagen / Lok abgestellt</button>'+
 '<button class="small" onclick="loadUnload()">📦 Laden / Entladen</button>'+
 '<button class="small" onclick="holdMove()">⏸ Halten / Warten</button>'+
 '<button class="small" onclick="add(\'Störung\')">⚠️ Störung</button>'+
 '<button class="small" onclick="add(\'Zug fertig\')">✅ Zug fertig</button></div>';
 if(active)e.innerHTML+='<div class="item"><b>Aktiver Rangiervorgang:</b> '+esc(active.von)+' → '+esc(active.nach)+' · '+esc(active.fahrart)+'</div>';
 renderEvents()}
function detail(t,p){let v=prompt(p+':','');if(v!==null)add(t,{detail:v})}
function chooseRangierart(){
 let v=prompt('Rangierart:\n1 = Geschoben\n2 = Gezogen','1');
 if(v==='1')return 'geschoben';
 if(v==='2')return 'gezogen';
 return null;
}
function move(){
 let v=prompt('Von:','');
 if(v===null||!v.trim())return;
 let n=prompt('Nach:','');
 if(n===null||!n.trim())return;
 let fahrart=chooseRangierart();
 if(!fahrart)return;
 let active={von:v.trim(),nach:n.trim(),fahrart,startedAt:now()};
 setActiveRangier(active);
 add('Rangieren',{von:active.von,nach:active.nach,fahrart:active.fahrart});
 renderRole();
}
function holdMove(){
 let active=getActiveRangier();
 if(!active)return alert('Kein aktiver Rangiervorgang. Bitte zuerst Rangieren starten.');
 let v=prompt('Halten / Warten:\n1 = Zug / Fahrzeug\n2 = Mitarbeiter im Gleisbereich\n3 = Warten auf Zustimmung\n4 = Störung\n5 = Sonstiges','');
 let m={'1':'Zug / Fahrzeug','2':'Mitarbeiter im Gleisbereich','3':'Warten auf Zustimmung','4':'Störung'};
 if(v==='5'){
   let d=prompt('Sonstiges:','');
   if(d===null||!d.trim())return;
   add('Halten / Warten',{detail:'Sonstiges – '+d.trim(),rangierVorgang:active.von+' → '+active.nach});
 }else if(m[v]){
   add('Halten / Warten',{detail:m[v],rangierVorgang:active.von+' → '+active.nach});
 }else return;
 renderRole();
}
function continueMove(){
 let active=getActiveRangier();
 if(!active)return alert('Kein aktiver Rangiervorgang.');
 let choice=prompt('Rangiervorgang fortsetzen\nAktuell: '+active.von+' → '+active.nach+'\n\n1 = '+active.von+'\n2 = '+active.nach+'\n3 = Neue Angabe','2');
 if(choice===null)return;
 let start;
 if(choice==='1')start=active.von;
 else if(choice==='2')start=active.nach;
 else if(choice==='3'){
   start=prompt('Weiter ab:','');
   if(start===null||!start.trim())return;
   start=start.trim();
 }else return;
 let target=prompt('Weiter nach:','');
 if(target===null||!target.trim())return;
 let next={von:start,nach:target.trim(),fahrart:active.fahrart,startedAt:active.startedAt};
 add('Rangieren',{von:next.von,nach:next.nach,fahrart:next.fahrart});
 setActiveRangier(next);
 renderRole();
}
function endMove(){
 let active=getActiveRangier();
 if(!active)return;
 add('Rangiervorgang beendet',{detail:active.von+' → '+active.nach+' · '+active.fahrart});
 setActiveRangier(null);
 renderRole();
}
function secureWagons(){
  let v=prompt('Wagen gesichert:\n1 = Handbremse\n2 = Hemmschuhe','1');
  if(v==='1')add('Wagen gesichert',{detail:'Handbremse'});
  else if(v==='2')add('Wagen gesichert',{detail:'Hemmschuhe'});
}
function parkVehicle(){
 let gleis=prompt('Gleis:','');
 if(gleis===null||!gleis.trim())return;
 add('Wagen / Lok abgestellt',{detail:'Gleis '+gleis.trim()});
}
function loadUnload(){
 let v=prompt('Laden / Entladen wählen:\n1 = Nur beladen\n2 = Nur entladen\n3 = Beladen + Entladen','3');
 if(v==='1')add('Nur beladen');
 else if(v==='2')add('Nur entladen');
 else if(v==='3')add('Beladen + Entladen');
}
function getShiftEvents(){
 let all=load();
 if(!all.length)return [];
 let hasStart=all.some(x=>x.type==='Schichtbeginn');
 let hasEnd=all.some(x=>x.type==='Schichtende');
 if(hasStart&&!hasEnd){
   let starts=all.filter(x=>x.type==='Schichtbeginn');
   let s=starts[starts.length-1];
   let startIndex=all.lastIndexOf(s);
   return all.slice(startIndex);
 }
 return all.filter(x=>x.date===today());
}

function createPlans(){
 let from=document.getElementById('pFrom').value,to=document.getElementById('pTo').value;
 if(!from||!to||to<from)return alert('Bitte einen gültigen Zeitraum eingeben.');
 let tf=document.getElementById('pTimeFrom').value,tt=document.getElementById('pTimeTo').value;
 if(!tf||!tt)return alert('Bitte Von-/Bis-Zeit eintragen.');
 let roleName=document.getElementById('pRole').value,ort=document.getElementById('pOrt').value.trim(),auftraggeber=document.getElementById('pAuftraggeber').value.trim();
 let selected=[...document.querySelectorAll('#planForm input[type=checkbox]:checked')].map(x=>Number(x.value));
 let d=get(),id=Date.now();
 for(let cur=new Date(from+'T12:00:00');cur<=new Date(to+'T12:00:00');cur.setDate(cur.getDate()+1)){
   if(!selected.includes(cur.getDay()))continue;
   let date=`${pad(cur.getDate())}.${pad(cur.getMonth()+1)}.${cur.getFullYear()}`;
   d.push({kind:'plan',id:id++,date,time:`${tf}-${tt}`,role:roleName,ort,auftraggeber});
 }
 save(d);document.getElementById('planForm').classList.add('hidden');renderPlans();
}

 let byDate={};a.forEach(p=>(byDate[p.date]||(byDate[p.date]=[])).push(p));
 let base=new Date();base.setHours(12,0,0,0);base.setDate(base.getDate()+planWeekOffset*7);

 let days=['Mo','Di','Mi','Do','Fr','Sa','So'];
 let iso=x=>`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;

 if(!selectedPlanDate || !byDate[selectedPlanDate]){

 let selected=byDate[selectedPlanDate]||[];

 e.innerHTML+=detail;
}

function homeArrival(){
 let t=document.getElementById('arrivalType')?.value||'Wohnsitz';
 if(t==='Einsatzort')return alert('Am Einsatzort bitte ANGEKOMMEN verwenden.');
 let km=prompt('KM-Endstand bei Ankunft / Tagesabschluss:','');
 if(km===null||!km.trim())return;
 if(!/^\d+(?:[.,]\d+)?$/.test(km.trim()))return alert('Bitte einen gültigen KM-Endstand eingeben.');
 add('Ankunft / Tagesabschluss',{zielart:t,kmEnd:km.trim().replace(',','.')});
}
function kmNumber(v){let n=parseFloat(String(v??'').replace(',','.'));return Number.isFinite(n)?n:null;}
function dailyKmTotal(events){
 let total=0,lastStart=null;
 events.forEach(x=>{
  if(x.type==='Abfahrt'){let k=kmNumber(x.kmStart);if(k!==null)lastStart=k;}
  if((x.type==='Angekommen'||x.type==='Ankunft / Tagesabschluss')&&x.kmEnd){
   let end=kmNumber(x.kmEnd);
   if(lastStart!==null&&end!==null&&end>=lastStart){total+=end-lastStart;lastStart=null;}
  }
 });
 return total;
}
