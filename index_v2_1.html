<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f4e78">
<link rel="manifest" href="./manifest.webmanifest">
<title>Meine Schicht</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f2f4f7;color:#17202a}
.wrap{max-width:560px;margin:auto;padding:16px}
h1{margin:4px 0;font-size:28px}.sub{color:#667085;margin-bottom:14px}
.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:13px;box-shadow:0 2px 10px #0001}
label{font-weight:bold;display:block;margin:8px 0 6px}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3da;border-radius:10px;font-size:16px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:14px;padding:17px 8px;font-size:16px;font-weight:bold}
.b1{background:#d9f7df}.b2{background:#dceeff}.b3{background:#fff0c9}.b4{background:#ffdcdc}
.small{padding:11px;font-size:14px;background:#e9ecef}
.km{font-size:18px;font-weight:bold}
.status{line-height:1.55}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 4px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.result{font-size:18px;font-weight:bold;margin-top:10px}
.warn{color:#a15c00;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>Meine Schicht</h1>
<div class="sub">Einmal drücken – Datum und Uhrzeit werden dauerhaft gespeichert.</div>

<div class="card">
<label>Startort</label>
<select id="start">
<option>Hauptwohnung</option>
<option>Zweitwohnung Arbeit</option>
<option>Sonstiger Startort</option>
</select>
<label>Sonstiger Startort (optional)</label>
<input id="startOther" placeholder="z. B. Hotel / Parkplatz">
<label>KM-Stand bei Abfahrt</label>
<input id="kmStart" class="km" inputmode="numeric" type="number" placeholder="z. B. 124580">
</div>

<div class="card">
<label>Einsatzort</label>
<div class="warn">Der Einsatzort wird erst bei „ANGEKOMMEN“ erfasst.</div>
<input id="ort" placeholder="wird bei Ankunft eingetragen">
</div>

<div class="card">
<div class="grid">
<button class="b1" onclick="stamp('Abfahrt',true)">🚗<br>ABFAHRT</button>
<button class="b2" onclick="stamp('Ankunft Einsatzort',false)">📍<br>ANGEKOMMEN</button>
<button class="b3" onclick="stamp('Arbeitsende / Abfahrt',false)">🚗<br>ARBEITSENDE</button>
<button class="b4" onclick="stamp('Ankunft Ziel',true)">🏠<br>ZUHAUSE</button>
</div>
</div>

<div class="card">
<label>Ziel nach dem Einsatz</label>
<select id="ziel">
<option>Hauptwohnung</option>
<option>Zweitwohnung Arbeit</option>
<option>Sonstiger Zielort</option>
</select>
<label>Sonstiger Zielort (optional)</label>
<input id="zielOther" placeholder="z. B. Hotel / Parkplatz">
<label>KM-Stand bei Rückkehr</label>
<input id="kmEnd" class="km" inputmode="numeric" type="number" placeholder="z. B. 124742">
<div id="kmResult" class="result"></div>
</div>

<div class="card">
<label>Bemerkung</label>
<textarea id="bem" placeholder="z. B. Wartezeit, Personalwechsel, Übergabe/Übernahme ..."></textarea>
<div class="actions">
<button class="small" onclick="saveNote()">Bemerkung speichern</button>
<button class="small" onclick="newDay()">Neuen Tag beginnen</button>
<button class="small" onclick="exportCSV()">Excel/CSV exportieren</button>
</div>
</div>

<div class="card">
<div class="status"><b>Heute</b><div id="today">Noch keine Erfassung.</div></div>
</div>

<div class="card">
<b>Gespeicherte Erfassungen</b>
<div style="overflow:auto;margin-top:8px">
<table><thead><tr><th>Datum</th><th>Vorgang</th><th>Zeit</th><th>Ort / KM</th></tr></thead>
<tbody id="history"></tbody></table>
</div>
</div>
</div>

<script>
const KEY='meine_schicht_v2';
function data(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
function now(){
 const d=new Date(),p=n=>String(n).padStart(2,'0');
 return {date:`${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`,time:`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`}
}
function selected(id,otherId){
 const v=document.getElementById(id).value;
 return v==='Sonstiger Startort'||v==='Sonstiger Zielort' ? (document.getElementById(otherId).value.trim()||v) : v;
}
function stamp(type,needsKM){
 const n=now(), d=data();
 let ort=document.getElementById('ort').value.trim();

 if(type==='Abfahrt'){
   const km=document.getElementById('kmStart').value;
   if(!km){alert('Bitte zuerst den KM-Stand bei Abfahrt eingeben.');return}
   const startOrt=selected('start','startOther');
   d.push({date:n.date,time:n.time,type,ort:'',start:startOrt,ziel:'',kmStart:km,kmEnd:'',gefahren:'',note:''});
   document.getElementById('ort').value='';
 } else if(type==='Ankunft Einsatzort'){
   ort=prompt('Einsatzort eingeben:','');
   if(!ort || !ort.trim()){alert('Bitte den Einsatzort eingeben.');return}
   d.push({date:n.date,time:n.time,type,ort:ort.trim(),start:'',ziel:'',kmStart:'',kmEnd:'',gefahren:'',note:''});
   document.getElementById('ort').value=ort.trim();
 } else if(type==='Arbeitsende / Abfahrt'){
   d.push({date:n.date,time:n.time,type,ort,start:'',ziel:'',kmStart:'',kmEnd:'',gefahren:'',note:''});
 } else {
   const km=document.getElementById('kmEnd').value;
   if(!km){alert('Bitte zuerst den KM-Stand bei Rückkehr eingeben.');return}
   const ziel=selected('ziel','zielOther');
   const startRec=[...d].reverse().find(x=>x.type==='Abfahrt' && x.date===n.date);
   const kmStart=startRec?Number(startRec.kmStart):null;
   const gefahren=kmStart!==null?Number(km)-kmStart:null;
   if(gefahren!==null && gefahren<0){alert('Der Rückkehr-KM-Stand ist kleiner als der Start-KM-Stand. Bitte prüfen.');return}
   d.push({date:n.date,time:n.time,type,ort:'',start:'',ziel,kmStart:kmStart??'',kmEnd:km,gefahren:gefahren??'',note:''});
   document.getElementById('kmResult').textContent=gefahren!==null?'Gefahrene Kilometer: '+gefahren+' km':'';
 }
 save(d);render();navigator.vibrate?.(80);
}
function saveNote(){
 const note=document.getElementById('bem').value.trim(),d=data(),last=d[d.length-1];
 if(!note){alert('Bitte zuerst eine Bemerkung eingeben.');return}
 if(!last){alert('Noch keine Erfassung vorhanden.');return}
 last.note=note;save(d);document.getElementById('bem').value='';render();alert('Bemerkung gespeichert.');
}
function newDay(){
 ['ort','startOther','zielOther','kmStart','kmEnd','bem'].forEach(id=>document.getElementById(id).value='');
 document.getElementById('kmResult').textContent='';
 alert('Neuer Tag bereit. Die bisherigen Daten bleiben gespeichert.');
}
function render(){
 const d=data(),today=now().date,td=d.filter(x=>x.date===today);
 document.getElementById('today').innerHTML=td.length?td.map(x=>`${x.time} – ${x.type}${x.ort?' – '+esc(x.ort):''}${x.start?' – Start: '+esc(x.start):''}${x.ziel?' – Ziel: '+esc(x.ziel):''}${x.kmEnd?' – KM: '+esc(x.kmEnd):''}`).join('<br>'):'Noch keine Erfassung.';
 document.getElementById('history').innerHTML=d.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${x.type}${x.note?'<br><small>'+esc(x.note)+'</small>':''}</td><td>${x.time}</td><td>${esc(x.ort||'')}${x.start?'<br>Start: '+esc(x.start):''}${x.ziel?'<br>Ziel: '+esc(x.ziel):''}${x.kmStart?'<br>KM Start: '+x.kmStart:''}${x.kmEnd?'<br>KM Ende: '+x.kmEnd:''}${x.gefahren!==undefined&&x.gefahren!==''?'<br><b>'+x.gefahren+' km</b>':''}</td></tr>`).join('')||'<tr><td colspan="4">Noch nichts gespeichert.</td></tr>';
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function exportCSV(){
 const d=data();if(!d.length){alert('Noch keine Daten zum Exportieren.');return}
 let csv='Datum;Uhrzeit;Vorgang;Einsatzort;Startort;Zielort;KM Start;KM Ende;Gefahrene KM;Bemerkung\n';
 csv+=d.map(x=>[x.date,x.time,x.type,x.ort||'',x.start||'',x.ziel||'',x.kmStart||'',x.kmEnd||'',x.gefahren??'',x.note||''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
 const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='Schichtzeiterfassung.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
render();
</script>
<script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("./service-worker.js").catch(()=>{}); }</script>
</body>
</html>
