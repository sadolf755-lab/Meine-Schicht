<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f4e78">
<title>Meine Schicht – Monatsbericht</title>
<style>
:root{--bg:#020a12;--panel:#061522;--panel2:#091b2a;--line:#123d59;--text:#f5f8fb;--muted:#91a6b8;--blue:#29a8ff;--green:#7cff32}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 0%,#0d2940 0,transparent 34%),linear-gradient(180deg,#020913,#03101a 50%,#020911);color:var(--text);font-family:Arial,sans-serif}
.wrap{max-width:680px;margin:auto;padding:14px 16px 34px}
header{display:flex;align-items:center;gap:14px;padding:6px 0 16px}
header img{width:76px;height:76px;object-fit:contain;border-radius:17px}
h1{margin:0 0 5px;font-size:30px}
.sub{color:#a6b7c6;font-size:14px}
.card{background:linear-gradient(180deg,#061522,#06121d);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 0 20px #0007}
h2{margin:3px 0 10px}
button{width:100%;border:1px solid #204b66;border-radius:15px;padding:14px 12px;margin-top:9px;background:#0a1928;color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.primary{background:#082239;border-color:#1978ad}
button.green{background:#0b2417;border-color:#4c9c2d;color:#cfffad}
button.back{background:#0a1928}
.stats{display:flex;justify-content:space-between;gap:12px;color:#bcd0dd}
.empty{color:var(--muted);padding:10px 0}
.rowitem{border:1px solid #1a435d;background:#071826;border-radius:14px;padding:12px;margin:8px 0;display:grid;gap:4px}
.check{background:#132536;border-color:#2c78a8;color:#dff3ff}
.muted{color:var(--muted);font-size:13px}
.entry-check-overlay{position:fixed;inset:0;background:#02070dcc;z-index:9999;display:none;overflow:auto;padding:18px}
.entry-check-panel{max-width:1200px;margin:0 auto;background:linear-gradient(180deg,#071725,#06111b);border:1px solid #24536f;border-radius:20px;box-shadow:0 12px 45px #000b;padding:18px}
.entry-check-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.entry-check-head h2{margin:0}
.entry-check-close{width:auto;margin:0;padding:10px 14px;background:#111f2c;border-color:#31546a}
.entry-check-note{margin:0 0 12px;color:#a9bdca;font-size:13px}
.entry-check-table-wrap{overflow:auto;border:1px solid #1b435b;border-radius:14px}
.entry-check-table{width:100%;border-collapse:collapse;min-width:1250px;font-size:13px}
.entry-check-table th,.entry-check-table td{border:1px solid #1a435d;padding:8px 9px;text-align:left;vertical-align:top}
.entry-check-table th{background:#0b2435;color:#eaf6ff;position:sticky;top:0;z-index:1;white-space:nowrap}
.entry-check-table td{background:#071826}
.entry-check-table tr:nth-child(even) td{background:#091e2d}
.entry-check-table .num{text-align:right;white-space:nowrap}
.entry-check-empty{padding:18px;text-align:center;color:var(--muted)}
@media(max-width:800px){
  .entry-check-overlay{padding:8px}
  .entry-check-panel{padding:12px;border-radius:16px}
  .entry-check-head{align-items:flex-start}
}
</style>

  <div id="rows" style="margin-top:10px"></div>
</div>

<div class="card">
  <button class="primary" onclick="showRows()">📊 Excel-Ansicht aktualisieren</button>
  <button class="check" onclick="openEntryCheck()">👁️ Einträge prüfen</button>
  <button class="green" onclick="exportMonthlyReport()">⬇️ Excel herunterladen</button>
  <button class="back" onclick="backToApp()">↩️ Zurück zu Meine Schicht</button>
  <div id="reportMessage" class="muted" style="margin-top:10px"></div>
  <div class="muted" style="margin-top:10px">Die App liest nur die bereits gespeicherten Tagesdaten. Es werden keine Schichten simuliert oder verändert.</div>
</div>
</div>

<script>

const KEY='meine_schicht_v3';
const SETTINGS_KEY='meine_schicht_stammdaten';

function get(){
  try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}
}
function load(){return get()}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
function pad(n){return String(n).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function getSettings(){try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}catch(e){return{}}}

function parseDateTime(date,time){
  const dm=String(date||'').match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  const tm=String(time||'').match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  if(!dm||!tm)return null;
  return new Date(Number(dm[3]),Number(dm[2])-1,Number(dm[1]),Number(tm[1]),Number(tm[2]),Number(tm[3]||0));
}
function minutesBetween(a,b){
  const x=parseDateTime(a.date,a.time),y=parseDateTime(b.date,b.time);
  if(!x||!y)return 0;
  let n=(y-x)/60000;if(n<0)n+=1440;return n;
}
function decHours(mins){return Number((mins/60).toFixed(2))}
function eventsForDate(date){
  return get().filter(x=>x.kind==='event' && x.date===date).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
}
function datesInData(){
  return [...new Set(get().filter(x=>x.kind==='event'&&x.date).map(x=>x.date))]
    .sort((a,b)=>parseDateTime(a,'00:00:00')-parseDateTime(b,'00:00:00'));
}

function kmNumber(v){
  const n=parseFloat(String(v??'').replace(',','.'));
  return Number.isFinite(n)?n:null;
}
function durationHours(a,b){
  if(!a||!b)return null;
  const x=String(a).slice(0,8).split(':').map(Number);
  const y=String(b).slice(0,8).split(':').map(Number);
  if(x.length<2||y.length<2||x.some(Number.isNaN)||y.some(Number.isNaN))return null;
  let mins=(y[0]*60+y[1])-(x[0]*60+x[1]);
  if(mins<0)mins+=1440;
  return mins/60;
}
function pauseForHours(h){
  if(h==null)return '';
  return h<=9?0.5:(h<=10?0.75:1);
}
function groupEvents(){
  const g={};
  for(const x of get().filter(x=>x.kind==='event')){
    (g[x.date]??=[]).push(x);
  }
  for(const d of Object.keys(g)) g[d].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  return g;
}
function dailyKmForDate(date,g){
  const ev=g[date]||[];
  let total=0,lastStart=null;
  for(const x of ev){
    if(x.type==='Abfahrt'){
      const k=kmNumber(x.kmStart);
      if(k!==null) lastStart=k;
    }
    if((x.type==='Ankunft / Tagesabschluss'||x.type==='Angekommen') && x.kmEnd){
      const end=kmNumber(x.kmEnd);
      if(lastStart!==null && end!==null && end>=lastStart){
        total+=end-lastStart;
        lastStart=null;
      }
    }
  }
  return total;
}
function plannedForDate(date,g){
  const all=get();
  const plans=all.filter(x=>x.kind==='plan' && x.date===date);
  const role=(g[date]||[]).find(x=>x.role)?.role||'';
  return plans.find(x=>x.role===role)||plans[0]||null;
}
function buildReportRows(){
  const g=groupEvents();
  const rows=[];
  let realDayCount=0;

  for(let day=1;day<=31;day++){
    const date=Object.keys(g).find(d=>Number(String(d).slice(0,2))===day);
    const ev=date?(g[date]||[]):[];
    if(ev.length) realDayCount++;

    const dep=ev.find(x=>x.type==='Abfahrt');
    const arrival=ev.find(x=>x.type==='Angekommen');
    const dayEnd=ev.filter(x=>x.type==='Ankunft / Tagesabschluss').slice(-1)[0] || null;
    const shiftStart=ev.find(x=>x.type==='Schichtbeginn');
    const shiftEnd=ev.find(x=>x.type==='Schichtende');
    const plan=plannedForDate(date,g);

    const wohnort=dep?.start||'';
    const baustelle=plan?.ort||arrival?.ort||dayEnd?.zielart||dayEnd?.ort||'';
    const reiseVon=dep?.time||'';
    const reiseBis=(dayEnd?.time||arrival?.time||'');
    const reisezeit=reiseVon&&reiseBis
      ? String(reiseVon).slice(0,5)+'–'+String(reiseBis).slice(0,5)
      : '';
    const ausserHaus=durationHours(reiseVon,reiseBis);
    const kmDay=date?dailyKmForDate(date,g):0;

    let arbeitsVon=shiftStart?.time||'';
    let arbeitsBis=shiftEnd?.time||'';
    if(!arbeitsVon && plan?.time){
      const m=String(plan.time).match(/^(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})$/);
      if(m){arbeitsVon=m[1].padStart(2,'0')+':'+m[2];arbeitsBis=m[3].padStart(2,'0')+':'+m[4];}
    }

    const arbeitszeit=durationHours(arbeitsVon,arbeitsBis);
    const pause=pauseForHours(arbeitszeit);

    const privateKm=ev
      .filter(x=>x.type==='Private Fahrt mit Firmen-KFZ')
      .reduce((s,x)=>s+(kmNumber(x.privateKm)||0),0);

    const actual=arbeitszeit==null?'':Math.max(0,arbeitszeit-(Number(pause)||0));
    const auftrag=plan?.auftraggeber||ev.find(x=>x.auftraggeber)?.auftraggeber||'';
    const auftragBaustelle=auftrag
      ? (baustelle ? auftrag+' / '+baustelle : auftrag)
      : baustelle;

    if(!ev.length){
      rows.push([day,'','','','','','','', '', '', '', '', '', '', '', '', '']);
      continue;
    }

    rows.push([
      day,                         // A Tag
      wohnort,                     // B von Wohnort
      baustelle,                   // C zur Baustelle
      reisezeit,                   // D Reisezeit von–bis
      ausserHaus==null?'':Number(ausserHaus.toFixed(2)), // E Zeit außer Haus
      plan?.plate||plan?.kennzeichen||'',                // F
      kmDay||0,                    // G Tages-km
      '',                          // H Privat-Kfz
      privateKm||'',               // I private km mit Firmen-Kfz
      '',                          // J Übernachtung
      ev.find(x=>x.role)?.role||plan?.role||'',           // K
      auftragBaustelle,            // L
      arbeitsVon?String(arbeitsVon).slice(0,5):'',       // M
      arbeitsBis?String(arbeitsBis).slice(0,5):'',       // N
      pause,                        // O
      actual===''?'':Number(actual.toFixed(2)),          // P
      ''                            // Q
    ]);
  }

  buildReportRows._realDayCount=realDayCount;
  return rows;
}


function formatCheckValue(v, colIndex){
  if(v===null || v===undefined || v==='') return '–';
  if([4,6,8,14,15].includes(colIndex) && typeof v==='number'){
    return Number(v).toLocaleString('de-DE');
  }
  return String(v);
}

function openEntryCheck(){
  // Erst die bestehende Monatsbericht-Ansicht aktualisieren.
  showRows();

  const source=document.getElementById('rows');
  const count=document.getElementById('count');
  let overlay=document.getElementById('entryCheckOverlay');

  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='entryCheckOverlay';
    overlay.className='entry-check-overlay';
    overlay.innerHTML=`
      <div class="entry-check-panel">
        <div class="entry-check-head">
          <h2>👁️ Einträge prüfen</h2>
          <button class="entry-check-close" onclick="closeEntryCheck()">✕ Schließen</button>
        </div>
        <p class="entry-check-note">
          Monatsbericht-Vorschau der aktuell gespeicherten Tagesdaten.
          Diese Ansicht entspricht der normalen Monatsbericht-Anzeige und verändert keine Daten.
        </p>
        <div class="entry-check-note" id="entryCheckCount"></div>
        <div id="entryCheckContent"></div>
      </div>`;
    document.body.appendChild(overlay);
  }

  const content=document.getElementById('entryCheckContent');
  const countBox=document.getElementById('entryCheckCount');

  countBox.innerHTML=`<b>${esc(count.textContent||'0')}</b> gespeicherte Tage`;

  if(!source || !source.innerHTML.trim()){
    content.innerHTML='<div class="entry-check-empty">Keine Monatsbericht-Einträge vorhanden.</div>';
  }else{
    // Die bereits gerenderte Monatsbericht-Ansicht 1:1 übernehmen.
    content.innerHTML=source.innerHTML;
  }

  overlay.style.display='block';
  document.body.style.overflow='hidden';
}

function closeEntryCheck(){
  const overlay=document.getElementById('entryCheckOverlay');
  if(overlay) overlay.style.display='none';
  document.body.style.overflow='';
}

function showRows(){
  const rows=buildReportRows();
  const box=document.getElementById('rows');
  const realDayCount=buildReportRows._realDayCount||0;

  if(!realDayCount){
    box.innerHTML='<div class="empty">Noch keine gespeicherten Tagesdaten vorhanden.</div>';
    document.getElementById('count').textContent='0';
    return;
  }

  document.getElementById('count').textContent=realDayCount;

  const visibleRows=rows.filter(r=>{
    // Nur tatsächlich gespeicherte Tage anzeigen; leere Platzhalter aus
    // der 31-Tage-Excelstruktur bleiben in der Vorschau unsichtbar.
    return r.slice(1).some(v=>v!=='' && v!==null && v!==undefined);
  });

  box.innerHTML=visibleRows.map(r=>`<div class="rowitem">
    <b>Tag ${esc(r[0])}</b>
    <span>${esc(r[10]||'–')}</span>
    <span>${esc(r[1]||'–')} → ${esc(r[2]||'–')}</span>
    <span>🕒 ${esc(r[3]||'–')} · außer Haus: ${r[4]!=='' ? Number(r[4]).toLocaleString('de-DE')+' Std.' : '–'}</span>
    <span>🚗 ${Number(r[6]||0).toLocaleString('de-DE')} km · Arbeitszeit: ${r[15]!=='' ? Number(r[15]).toLocaleString('de-DE')+' Std.' : '–'}</span>
  </div>`).join('');
}
function backToApp(){window.location.assign('https://sadolf755-lab.github.io/Meine-Schicht/index.html')}

function xmlEscape(v){
  return String(v)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&apos;');
}

function setXlsxCell(xml, ref, value){
  // Vorhandene XLSX-Zellen ersetzen. Falls eine leere Zelle in der Vorlage
  // technisch nicht gespeichert ist, wird sie mit dem Zeilenstil angelegt.
  const cellRe=new RegExp('<c\\b([^>]*\\br="'+ref+'"[^>]*?)(?:>([\\s\\S]*?)</c>|\\s*/>)','i');
  const m=xml.match(cellRe);

  let attrs='';
  let replacement='';

  if(m){
    attrs=m[1].replace(/\s+t="[^"]*"/i,'').trim();
  }else{
    const rowNumber=ref.match(/\d+$/)?.[0];
    if(!rowNumber) throw new Error('Ungültige Zelladresse '+ref);

    const rowRe=new RegExp('(<row\\b[^>]*\\br="'+rowNumber+'"[^>]*>)([\\s\\S]*?)(</row>)','i');
    const rr=xml.match(rowRe);
    if(!rr) throw new Error('Zeile '+rowNumber+' wurde in der Originalvorlage nicht gefunden.');

    const styleMatch=rr[2].match(/<c\\b[^>]*\\bs="([^"]+)"/i);
    const style=styleMatch ? ' s="'+styleMatch[1]+'"' : '';
    attrs='r="'+ref+'"'+style;
  }

  if(value===null || value===undefined || value===''){
    replacement='<c '+attrs+' t="n"></c>';
  }else if(typeof value==='number' && Number.isFinite(value)){
    replacement='<c '+attrs+' t="n"><v>'+value+'</v></c>';
  }else{
    replacement='<c '+attrs+' t="inlineStr"><is><t xml:space="preserve">'+xmlEscape(value)+'</t></is></c>';
  }

  if(m){
    return xml.slice(0,m.index)+replacement+xml.slice(m.index+m[0].length);
  }

  const rowNumber=ref.match(/\d+$/)[0];
  const rowRe=new RegExp('(<row\\b[^>]*\\br="'+rowNumber+'"[^>]*>)([\\s\\S]*?)(</row>)','i');
  const rr=xml.match(rowRe);
  if(!rr) throw new Error('Zeile '+rowNumber+' wurde in der Originalvorlage nicht gefunden.');

  const insert=rr[1]+rr[2]+replacement+rr[3];
  return xml.slice(0,rr.index)+insert+xml.slice(rr.index+rr[0].length);
}

function forceXlsxRecalculation(xml){
  const calcPrRe=/<calcPr\b[^>]*\/>/i;
  const calcAttrs='calcId="191029" calcMode="auto" fullCalcOnLoad="1" forceFullCalc="1"';
  if(calcPrRe.test(xml)){
    return xml.replace(calcPrRe,'<calcPr '+calcAttrs+'/>');
  }
  return xml.replace(/<workbook([^>]*)>/i,'<workbook$1><calcPr '+calcAttrs+'/>' );
}

function setFormulaCachedValue(xml, ref, value){
  const re=new RegExp('(<c\\b[^>]*\\br="'+ref+'"[^>]*>[\\s\\S]*?<f\\b[^>]*>[\\s\\S]*?</f>)[\\s\\S]*?(<v>)[\\s\\S]*?(</v>)(\\s*</c>)','i');
  if(!re.test(xml)) return xml;
  return xml.replace(re,'$1$2'+(Number.isFinite(Number(value))?Number(value):0)+'$3$4');
}

function sumRows(rows, colIndex, startDay, endDay){
  return Number(rows
    .filter(r=>Number(r[0])>=startDay && Number(r[0])<=endDay)
    .reduce((sum,r)=>{
      const n=Number(r[colIndex]);
      return sum+(Number.isFinite(n)?n:0);
    },0).toFixed(2));
}

async function exportMonthlyReport(){
  const msg=document.getElementById('reportMessage');
  try{
    if(typeof JSZip==='undefined') throw new Error('JSZip wurde nicht geladen.');

    const rows=buildReportRows();
    if(!buildReportRows._realDayCount) throw new Error('Keine gespeicherten Tagesdaten aus Meine Schicht gefunden.');

    // Die Originalvorlage liegt separat neben dieser HTML-Datei auf GitHub Pages.
    // Kein Base64, kein eingebettetes Duplikat.
    const templateUrl=new URL('./Monatsbericht_Vorlage.xlsx',window.location.href);
    templateUrl.searchParams.set('_export',Date.now());

    const response=await fetch(templateUrl.toString(),{
      method:'GET',
      cache:'no-store',
      credentials:'same-origin'
    });
    if(!response.ok){
      throw new Error('Originalvorlage konnte nicht geladen werden (HTTP '+response.status+').');
    }

    const contentType=(response.headers.get('content-type')||'').toLowerCase();
    const buffer=await response.arrayBuffer();
    if(buffer.byteLength<100){
      throw new Error('Die geladene Originalvorlage ist leer oder unvollständig.');
    }

    const zip=await JSZip.loadAsync(buffer);
    const sheetFile=zip.file('xl/worksheets/sheet1.xml');
    if(!sheetFile) throw new Error('Tabelle1 der Originalvorlage wurde nicht gefunden.');

    let xml=await sheetFile.async('string');

    // A bleibt die Tagesnummer. B–Q werden aus der Monatsbericht-Vorschau
    // in die bestehenden Tageszeilen der Originalvorlage geschrieben.
    for(const values of rows){
      const day=Number(values[0]);
      const r=day<=15 ? 8+day : 13+day;
      for(let c=1;c<17;c++){
        xml=setXlsxCell(xml,String.fromCharCode(65+c)+r,values[c]);
      }
    }

    // Die Originalvorlage enthält die Summenformeln bereits. Wir lassen die
    // Formeln unverändert, aktualisieren aber ihre gespeicherten Ergebnisse,
    // damit die exportierte Datei auch ohne sofortige Neuberechnung die
    // korrekten Summen anzeigt.
    //
    // Zeile 24 = Zwischensumme Tage 1–15
    // Zeile 45 = Monatssumme über die zweite Hälfte inkl. Übertrag.
    const sumCols=[
      ['E',4], ['G',6], ['H',7], ['I',8], ['P',15]
    ];
    for(const [col,idx] of sumCols){
      xml=setFormulaCachedValue(xml,col+'24',sumRows(rows,idx,1,15));
      xml=setFormulaCachedValue(xml,col+'45',sumRows(rows,idx,1,31));
    }

    // Q ist in der Originalvorlage eine abgeleitete Formel aus G/H.
    // Ihren Formelinhalt lassen wir unverändert; auch hier setzen wir nur
    // den sichtbaren Zwischenspeicher auf den aktuellen Wert.
    const gTotal=sumRows(rows,6,1,31);
    const hTotal=sumRows(rows,7,1,31);
    xml=setFormulaCachedValue(xml,'Q45',gTotal+hTotal);

    zip.file('xl/worksheets/sheet1.xml',xml);

    // Die Originalvorlage enthält bereits die Summenformeln. Sie werden nicht
    // überschrieben. Excel soll sie beim Öffnen zwingend neu berechnen.
    const workbookFile=zip.file('xl/workbook.xml');
    if(workbookFile){
      const workbookXml=await workbookFile.async('string');
      zip.file('xl/workbook.xml',forceXlsxRecalculation(workbookXml));
    }

    const blob=await zip.generateAsync({
      type:'blob',
      mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
      compression:'DEFLATE'
    });

    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='Meine-Schicht-Monatsbericht.xlsx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);

    msg.innerHTML='<span class="ok">✓ Originalvorlage geladen und befüllt. Vorhandene Summenformeln bleiben erhalten und werden beim Öffnen neu berechnet.</span>';
  }catch(err){
    console.error(err);
    if(msg) msg.innerHTML='<span class="warn">⚠️ '+esc(err.message)+'</span>';
    alert('Excel-Erzeugung fehlgeschlagen: '+err.message);
  }
}
showRows();

document.addEventListener('keydown',function(e){
  if(e.key==='Escape') closeEntryCheck();
});
</script>
</body>
</html>
